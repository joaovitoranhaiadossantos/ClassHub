<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minhas Dúvidas</title>
    <link rel="stylesheet" href="duvidas.css">
</head>

<body>
    <header>
        <h1>❓ Minhas Dúvidas</h1>
        <button onclick="voltar()">
            Voltar
        </button>
    </header>

    <main>
        <section class="formulario">
            <h2>Enviar uma dúvida</h2>

            <label>Disciplina</label>
            <select id="disciplina">
                <option value="">
                    Selecione
                </option>
                <option value="Matemática">
                    Matemática
                </option>
                <option value="História">
                    História
                </option>
                <option value="Biologia">
                    Biologia
                </option>
                <option value="Português">
                    Português
                </option>
            </select>

            <label>Tema</label>
            <input
                type="text"
                id="tema"
                placeholder="Ex: Equação do 2º grau"
            >

            <label>Sua dúvida</label>
            <textarea
                id="pergunta"
                placeholder="Digite sua dúvida..."
            ></textarea>

            <button id="enviar">
                Enviar dúvida
            </button>
        </section>

        <section>
            <h2>Dúvidas enviadas</h2>
            <div id="listaDuvidas"></div>
        </section>
    </main>

    <script src="duvidas.js"></script>
</body>

</html>
